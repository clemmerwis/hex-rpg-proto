    # Dev-only nginx config.
    #
    # Stock nginx sends ETag/Last-Modified but no Cache-Control, so browsers apply
    # heuristic freshness and happily reuse a cached ES module after you edit it.
    # That shows up as "I changed const.js and the browser still runs the old one".
    #
    # no-store forces a real fetch every time - correct for a volume-mounted dev
    # container where files change constantly and there is no build step.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        etag off;
        if_modified_since off;
    }

    # Character build storage - stands in for the eventual MySQL-backed API.
    #
    # GET    /characters/         -> JSON directory listing (the template index)
    # GET    /characters/foo.json -> read one build
    # PUT    /characters/foo.json -> create/overwrite
    # DELETE /characters/foo.json -> remove
    #
    # DEV ONLY: no auth, no validation, no concurrency control. This is a
    # localhost prototype convenience, never a shipping configuration.
    location /characters/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        etag off;
        if_modified_since off;

        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;

        autoindex on;
        autoindex_format json;
    }

    # Area definitions - writable so characters placed in-game persist to
    # area.json and survive a refresh. Same DEV ONLY caveats as above.
    location /areas/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        etag off;
        if_modified_since off;

        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;

        autoindex on;
        autoindex_format json;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
